name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Import smoke tests
        run: |
          python -c "import warhammer40k_ai"
          python -c "from warhammer40k_ai.engine.game import Game"
          warhammer40k-ai --version
          warhammer40k-ai-network --help

      - name: Run fast tests
        run: |
          python -m pytest tests/ -m "not slow and not integration"

  training-data-gate:
    name: Training Data Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build relabeled DecisionRecord fixture for gate check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = {
              "projected_score_delta_next_window": 0.0,
              "projected_score_delta_round": 0.0,
              "projected_deny_delta_next_window": 0.0,
              "projected_control_delta": 0.0,
              "projected_action_enablement_delta": 0.0,
              "projected_exposure_delta": 0.0,
              "projected_trade_ev": 0.0,
              "cover_delta": 0.0,
              "los_delta": 0.0,
              "resource_delta": 0.0,
              "rules_provenance_refs": ["rules_bundle:ci"],
          }

          decision_types = [
              "MOVE_UNIT",
              "DECLARE_SHOTS",
              "DECLARE_CHARGE",
              "SELECT_UNIT",
              "SELECT_FIGHT_TARGETS",
          ]
          games = 20
          records_per_game = 500
          records = []
          for game_idx in range(games):
              game_id = f"ci_game_{game_idx}"
              for step in range(records_per_game):
                  idx = (game_idx * records_per_game) + step
                  decision_id = f"ci_decision_{idx}"
                  records.append(
                      {
                          "decision_id": decision_id,
                          "decision_type": decision_types[step % len(decision_types)],
                          "game_id": game_id,
                          "rules_bundle_id": "rules_bundle:ci",
                          "relabel_status": "updated_under_target_rules_bundle",
                          "omniscient_state": {
                              "players": [
                                  {"player_id": "ci_player_1", "score": int(step // 50)},
                                  {"player_id": "ci_player_2", "score": int(step // 100)},
                              ]
                          },
                          "descriptor_ids": {
                              "mission_descriptor_id": "mission_descriptor:ci",
                              "objective_descriptor_ids": ["objective_descriptor:ci"],
                              "terrain_descriptor_ids": ["terrain_descriptor:ci"],
                              "deployment_descriptor_id": "deployment_descriptor:ci",
                              "tool_descriptor_ids": ["tool_descriptor:ci"],
                          },
                          "candidates": [
                              {
                                  "action_id": f"{decision_id}:a",
                                  "params": {},
                                  "metadata": dict(metadata),
                              }
                          ],
                      }
                  )

          output_path = Path("data/ci_decision_records_relabeled.json")
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(records, indent=2, sort_keys=True, ensure_ascii=True),
              encoding="utf-8",
          )
          print(f"Wrote {len(records)} records to {output_path}")
          PY

      - name: Enforce canonical pre-ML training-data gate profile
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python scripts/build_training_manifest.py \
            --input data/ci_decision_records_relabeled.json \
            --output data/ci_training_manifest.json \
            --source-tag ci \
            --enforce-gate-profile
