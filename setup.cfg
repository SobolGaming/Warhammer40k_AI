[metadata]
description-file = README.md

[bdist_wheel]
universal=1

[tool:pytest]
testpaths = tests
addopts = -ra --strict-markers -n auto --dist loadscope
filterwarnings =
    ignore:pkg_resources is deprecated as an API\..*:DeprecationWarning:pygame\.pkgdata
    ignore:Deprecated call to `pkg_resources\.declare_namespace\('google'\)`\..*:DeprecationWarning:pkg_resources
markers =
    slow: long-running tests that are expensive but still deterministic.
    integration: end-to-end tests that cross subsystem boundaries (networking, persistence, full parsing).
